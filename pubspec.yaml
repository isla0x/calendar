name: yeobaek
description: 여백 — 한눈에 보이고, 비는 시간까지 알려주는 캘린더 앱
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_calendar_plus: ^0.12.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# 앱 아이콘 (assets/icon/icon.png = 1024×1024, 알파 없음)
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
