name: yeobaek
description: 여백 — 한눈에 보이고, 비는 시간까지 알려주는 캘린더 앱
publish_to: "none"
version: 1.0.0+18

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_calendar_plus: ^0.12.0
  shared_preferences: ^2.3.0
  in_app_purchase: ^3.2.0
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # IBM Plex Sans KR (SIL OFL 1.1) — 인터넷에서 받지 않고 앱 안에 넣어요.
  fonts:
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700

# 앱 아이콘 (assets/icon/icon.png = 1024×1024, 알파 없음)
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
