name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 플랫폼 폴더 준비
        run: bash tools/bootstrap.sh
      - run: flutter pub get
      - name: 분석
        run: bash tools/ci_report.sh analyze flutter analyze --no-fatal-infos
      - name: 테스트
        run: bash tools/ci_report.sh test flutter test

  # 커밋 메시지에 [ios]가 들어 있거나 수동으로 실행했을 때만 iOS 빌드를 확인해요.
  ios-build:
    if: contains(github.event.head_commit.message, '[ios]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 플랫폼 폴더 준비
        run: bash tools/bootstrap.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
